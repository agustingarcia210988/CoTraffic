name: Co-Marketing Clustering

on:
  workflow_dispatch:
    inputs:
      data:
        description: "Ruta a un JSON con startups (vacío = datos de ejemplo)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "cluster_apps.py"
      - "requirements.txt"
      - ".github/workflows/clustering.yml"

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache modelos de HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ejecutar clustering
        run: |
          if [ -n "${{ inputs.data }}" ]; then
            python cluster_apps.py --data "${{ inputs.data }}" --output clusters_result.json
          else
            python cluster_apps.py --output clusters_result.json
          fi

      - name: Publicar resultado
        uses: actions/upload-artifact@v4
        with:
          name: clusters-result
          path: clusters_result.json
