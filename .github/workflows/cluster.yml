name: Co-Marketing Clustering

on:
  # Ejecucion semanal: todos los lunes a las 09:00 UTC.
  schedule:
    - cron: "0 9 * * 1"
  # Ejecucion bajo demanda desde la pestana Actions.
  workflow_dispatch:
    inputs:
      data:
        description: "Path local o URL HTTPS a un JSON de startups (vacio = dataset de ejemplo)"
        required: false
        default: ""
      producthunt:
        description: "Categorias de Product Hunt separadas por espacio ('all' = todas, vacio = no usar)"
        required: false
        default: "all"
      rss:
        description: "Feeds RSS/Atom genericos separados por espacio (vacio = no se usa)"
        required: false
        default: ""

# Necesario para commitear clusters_result.json de vuelta al repositorio.
permissions:
  contents: write

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cachear el modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Rueda CPU de torch: evita descargar ~2 GB de CUDA innecesario.
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ejecutar el clustering
        env:
          INPUT_DATA: ${{ inputs.data }}
          INPUT_PH: ${{ inputs.producthunt }}
          INPUT_RSS: ${{ inputs.rss }}
          EVENT: ${{ github.event_name }}
        run: |
          # La corrida semanal no recibe inputs: por defecto usa Product Hunt
          # para no clusterizar el dataset de ejemplo.
          if [ -z "$INPUT_PH" ] && [ "$EVENT" = "schedule" ]; then
            INPUT_PH="all"
          fi

          ARGS=(--output clusters_result.json)
          if [ -n "$INPUT_DATA" ]; then
            ARGS+=(--data "$INPUT_DATA")
          fi
          if [ "$INPUT_PH" = "all" ]; then
            ARGS+=(--producthunt)
          elif [ -n "$INPUT_PH" ]; then
            # Sin comillas a proposito: cada slug es un argumento separado.
            ARGS+=(--producthunt $INPUT_PH)
          fi
          if [ -n "$INPUT_RSS" ]; then
            ARGS+=(--rss $INPUT_RSS)
          fi
          echo "Ejecutando: python cluster_apps.py ${ARGS[@]}"
          python cluster_apps.py "${ARGS[@]}"

      - name: Verificar que se generaron clusters
        run: |
          total=$(python -c "import json;print(json.load(open('clusters_result.json'))['total_clusters'])")
          echo "Clusters generados: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::El pipeline no genero ningun cluster"
            exit 1
          fi

      - name: Commitear clusters_result.json en la raiz del repo
        run: |
          if [ -z "$(git status --porcelain clusters_result.json)" ]; then
            echo "Sin cambios en clusters_result.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clusters_result.json
          git commit -m "chore: actualizar clusters_result.json"

          # El checkout puede no estar en la punta de main: pasa en un re-run de
          # una corrida vieja, o si alguien pushea mientras el job corre. Sin
          # esto el push se rechaza por non-fast-forward.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publicar el resultado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: clusters-result
          path: clusters_result.json
